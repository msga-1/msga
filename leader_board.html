<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Leaderboard</title>
    <style>
        :root {
            --primary: #4fc3f7; --accent: #ff4081; --success: #00e676; 
            --dark: #0f172a; --panel: #1e293b; --glass: rgba(255, 255, 255, 0.1);
            --gold: #ffd700; --silver: #c0c0c0; --bronze: #cd7f32;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark);
            margin: 0; padding: 20px; color: white; display: flex; flex-direction: column;
            align-items: center; min-height: 100vh;
        }
        
        h1 { color: var(--primary); font-size: 3rem; margin: 0 0 20px 0; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 15px var(--primary); text-align: center; }
        
        /* Setup Sectie (Namen toevoegen) */
        #setup-section {
            background: var(--panel); border: 2px solid var(--primary); border-radius: 15px;
            padding: 20px; width: 100%; max-width: 600px; margin-bottom: 30px;
            box-shadow: 0 0 20px rgba(79, 195, 247, 0.2);
        }
        textarea {
            width: 100%; height: 80px; background: rgba(0,0,0,0.5); color: white;
            border: 1px solid var(--glass); border-radius: 8px; padding: 10px;
            font-family: inherit; font-size: 1.1rem; box-sizing: border-box; resize: vertical;
        }
        .btn-main {
            background: var(--primary); color: var(--dark); border: none; padding: 12px 20px;
            font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer;
            margin-top: 10px; width: 100%; text-transform: uppercase; transition: 0.2s;
        }
        .btn-main:hover { box-shadow: 0 0 15px var(--primary); transform: scale(1.02); }

        #btn-show-setup {
            background: transparent; color: var(--primary); border: 1px solid var(--primary);
            padding: 8px 15px; border-radius: 8px; cursor: pointer; margin-bottom: 20px;
            display: none; transition: 0.2s;
        }
        #btn-show-setup:hover { background: var(--glass); }

        /* Leaderboard Sectie */
        #leaderboard { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 10px; }
        
        .student-row {
            background: rgba(255,255,255,0.05); border: 1px solid var(--glass); border-radius: 10px;
            display: flex; align-items: center; padding: 15px 20px; transition: all 0.5s ease;
        }
        .student-row:hover { background: rgba(255,255,255,0.1); }
        
        /* Top 3 Styling */
        .rank-1 { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.4); }
        .rank-1 .rank-num { color: var(--gold); }
        .rank-2 { border-color: var(--silver); box-shadow: 0 0 10px rgba(192, 192, 192, 0.3); }
        .rank-2 .rank-num { color: var(--silver); }
        .rank-3 { border-color: var(--bronze); box-shadow: 0 0 10px rgba(205, 127, 50, 0.3); }
        .rank-3 .rank-num { color: var(--bronze); }

        .rank-num { font-size: 1.8rem; font-weight: 900; width: 50px; color: #666; }
        .student-name { flex: 1; font-size: 1.5rem; font-weight: bold; text-transform: capitalize; }
        .time-display { font-size: 1.8rem; font-family: monospace; color: var(--success); font-weight: bold; width: 120px; text-align: right; margin-right: 20px; }
        
        .time-input-group { display: flex; gap: 10px; }
        .time-input {
            width: 90px; padding: 10px; background: black; color: var(--primary);
            border: 1px solid var(--primary); border-radius: 5px; font-size: 1.2rem;
            font-family: monospace; text-align: center;
        }
        .btn-save {
            background: var(--accent); color: white; border: none; padding: 10px 15px;
            font-weight: bold; border-radius: 5px; cursor: pointer; transition: 0.2s;
        }
        .btn-save:hover { box-shadow: 0 0 10px var(--accent); }
        .btn-edit { background: transparent; color: #888; border: 1px solid #888; padding: 5px 10px; border-radius: 5px; cursor: pointer; }
        .btn-edit:hover { color: white; border-color: white; }
    </style>
</head>
<body>

    <h1>MISSION LEADERBOARD</h1>

    <div id="setup-section">
        <h3 style="margin-top:0; color:var(--primary);">1. Voeg leerlingen toe</h3>
        <p style="margin-bottom:10px; font-size:0.9rem; color:#ccc;">Plak hier een lijst met voornamen (gescheiden door een komma of een nieuwe regel).</p>
        <textarea id="names-input" placeholder="Bijv: Sem, Mila, Lucas, Sophie..."></textarea>
        <button class="btn-main" onclick="loadStudents()">Voeg Klas Toe</button>
    </div>

    <button id="btn-show-setup" onclick="showSetup()">+ Voeg meer namen toe</button>

    <div id="leaderboard">
        </div>

<script>
    let students = [];

    // 1. Namen inladen en vak verbergen
    function loadStudents() {
        const input = document.getElementById('names-input').value;
        if (!input.trim()) return;

        const names = input.split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
        
        names.forEach(name => {
            students.push({ id: Date.now() + Math.random(), name: name, time: null, seconds: Infinity });
        });

        document.getElementById('names-input').value = "";
        
        // Verberg het invoerveld en laat de kleine "+" knop zien
        if(names.length > 0) {
            document.getElementById('setup-section').style.display = 'none';
            document.getElementById('btn-show-setup').style.display = 'block';
        }

        renderLeaderboard();
    }

    // Laat het invoerveld weer zien als dat nodig is
    function showSetup() {
        document.getElementById('setup-section').style.display = 'block';
        document.getElementById('btn-show-setup').style.display = 'none';
    }

    // 2. Tijd omzetten naar seconden (voor accuraat sorteren)
    function timeToSeconds(timeStr) {
        if (!timeStr) return Infinity;
        const parts = timeStr.replace('.', ':').split(':');
        if (parts.length !== 2) return Infinity; 
        
        const minutes = parseInt(parts[0]) || 0;
        const seconds = parseInt(parts[1]) || 0;
        return (minutes * 60) + seconds;
    }

    // 3. Tijd opslaan
    function saveTime(id) {
        const inputEl = document.getElementById(`input-${id}`);
        let newTime = inputEl.value.trim();
        
        newTime = newTime.replace(/[ .]/g, ':');

        const student = students.find(s => s.id === id);
        if (student) {
            student.time = newTime === "" ? null : newTime;
            student.seconds = timeToSeconds(student.time);
        }
        renderLeaderboard();
    }

    function checkEnter(event, id) {
        if (event.key === 'Enter') {
            saveTime(id);
        }
    }

    function editTime(id) {
        const student = students.find(s => s.id === id);
        if (student) {
            student.time = null;
            student.seconds = Infinity;
        }
        renderLeaderboard();
        setTimeout(() => document.getElementById(`input-${id}`).focus(), 100);
    }

    // 4. Lijst sorteren en op het scherm tekenen
    function renderLeaderboard() {
        students.sort((a, b) => a.seconds - b.seconds);

        const container = document.getElementById('leaderboard');
        container.innerHTML = "";

        let currentRank = 1;

        students.forEach((student) => {
            const hasTime = student.seconds !== Infinity;
            const rankClass = hasTime && currentRank <= 3 ? `rank-${currentRank}` : '';
            const rankIcon = hasTime ? (currentRank === 1 ? '👑' : currentRank) : '-';

            const row = document.createElement('div');
            row.className = `student-row ${rankClass}`;
            
            let html = `
                <div class="rank-num">${rankIcon}</div>
                <div class="student-name">${student.name}</div>
            `;

            if (hasTime) {
                html += `
                    <div class="time-display">${student.time}</div>
                    <button class="btn-edit" onclick="editTime(${student.id})">✎</button>
                `;
                currentRank++; 
            } else {
                html += `
                    <div class="time-input-group">
                        <input type="text" id="input-${student.id}" class="time-input" placeholder="00:00" onkeydown="checkEnter(event, ${student.id})">
                        <button class="btn-save" onclick="saveTime(${student.id})">Save</button>
                    </div>
                `;
            }

            row.innerHTML = html;
            container.appendChild(row);
        });
    }
</script>
</body>
</html>
