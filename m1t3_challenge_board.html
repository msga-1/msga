<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Challenge Board</title>
    <style>
        :root {
            --primary: #4fc3f7; --accent: #ff4081; --success: #00e676; --error: #ff5252;
            --dark: #0f172a; --panel: #1e293b; --glass: rgba(255, 255, 255, 0.1);
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif; background: var(--dark);
            margin: 0; padding: 0; color: white; display: flex; flex-direction: column;
            height: 100vh; overflow: hidden;
        }
        
        /* Headers & UI */
        header { text-align: center; padding: 10px; background: rgba(0,0,0,0.3); }
        h1 { margin: 0; color: var(--primary); letter-spacing: 2px; text-transform: uppercase; font-size: 2rem;}
        
        /* Start Screen */
        #start-screen {
            position: absolute; inset: 0; background: var(--dark); z-index: 100;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .btn {
            background: var(--primary); color: var(--dark); border: none; padding: 15px 30px;
            font-size: 1.5rem; font-weight: bold; border-radius: 10px; cursor: pointer;
            margin: 10px; transition: 0.2s; text-transform: uppercase;
        }
        .btn:hover { transform: scale(1.05); box-shadow: 0 0 15px var(--primary); }
        .team-controls { display: flex; align-items: center; gap: 20px; margin: 30px 0; font-size: 2rem; }
        .circle-btn {
            width: 50px; height: 50px; border-radius: 50%; border: 2px solid var(--primary);
            background: transparent; color: var(--primary); font-size: 2rem; cursor: pointer;
            display: flex; justify-content: center; align-items: center;
        }
        .circle-btn:hover { background: var(--glass); }

        /* Game Board */
        #game-area { display: none; flex: 1; flex-direction: column; padding: 10px; }
        #board {
            display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px;
            flex: 1; margin-bottom: 10px;
        }
        .category-header {
            background: var(--accent); color: white; display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: bold; font-size: 1.2rem; border-radius: 8px; padding: 5px;
            box-shadow: 0 0 10px rgba(255, 64, 129, 0.4);
        }
        .tile {
            background: var(--panel); border: 2px solid var(--glass); border-radius: 8px;
            display: flex; justify-content: center; align-items: center;
            font-size: 2.5rem; font-weight: 900; color: var(--primary); cursor: pointer;
            transition: 0.2s; user-select: none;
        }
        .tile:hover:not(.played) { background: var(--glass); border-color: var(--primary); box-shadow: 0 0 15px var(--primary); transform: scale(1.02); }
        .tile.played { background: transparent; color: rgba(255,255,255,0.1); border-color: transparent; cursor: default; }

        /* Scoreboard */
        #scoreboard {
            display: flex; justify-content: space-around; background: rgba(0,0,0,0.4);
            padding: 15px; border-radius: 15px;
        }
        .team-score { text-align: center; font-size: 1.5rem; }
        .team-score span { display: block; font-size: 2.5rem; font-weight: bold; color: var(--success); }

        /* Modal (Question Overlay) */
        #modal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 1000;
            display: none; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; padding: 40px;
        }
        .modal-content {
            background: var(--panel); border: 2px solid var(--primary); border-radius: 20px;
            padding: 40px; max-width: 800px; width: 90%; box-shadow: 0 0 30px rgba(79, 195, 247, 0.3);
        }
        .q-cat { color: var(--accent); font-size: 1.2rem; font-weight: bold; letter-spacing: 2px; margin-bottom: 20px; }
        .q-text { font-size: 2.5rem; margin-bottom: 30px; line-height: 1.4; }
        .q-opts { font-size: 1.5rem; color: #aaa; margin-bottom: 30px; }
        .a-text { font-size: 3rem; color: var(--success); font-weight: bold; margin: 30px 0; display: none; }
        .award-buttons { display: none; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn-award { background: var(--success); color: var(--dark); border: none; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
        .btn-nobody { background: var(--error); color: white; border: none; padding: 15px 20px; font-size: 1.2rem; font-weight: bold; border-radius: 8px; cursor: pointer; }
    </style>
</head>

        { type: "open", pool: [
            {q: "The blue whale is the ________ (large) animal.", c: "largest"},
            {q: "Mount Everest is the ________ (high) mountain.", c: "highest"},
            {q: "This is the ________ (cheap) shirt in the shop.", c: "cheapest"},
            {q: "August is often the ________ (warm) month.", c: "warmest"},
            {q: "He is the ________ (strong) man I know.", c: "strongest"},
            {q: "This is the ________ (long) bridge in the country.", c: "longest"},
            {q: "That was the ________ (nice) thing to do.", c: "nicest"},
            {q: "The street is the ________ (wide) at the end.", c: "widest"},
            {q: "Russia is the ________ (big) country in the world.", c: "biggest"},
            {q: "July was the ________ (hot) month last year.", c: "hottest"},
            {q: "Who has the ________ (wet) coat?", c: "wettest"},
            {q: "You are my ________ (good) friend.", c: "best"},
            {q: "This is the ________ (good) cake ever!", c: "best"},
            {q: "A plane is faster than a car, but a rocket is the ________ (fast).", c: "fastest"},
            {q: "My bike is old, but his bike is ________ (old) than mine.", c: "older"},
            {q: "The sun is ________ (big) than the earth.", c: "bigger"},
            {q: "A mouse is ________ (small) than a rat.", c: "smaller"},
            {q: "Gold is ________ (heavy) than silver.", c: "heavier"},
            {q: "Is the moon ________ (near) than the sun?", c: "nearer"},
            {q: "She is ________ (smart) than her sister.", c: "smarter"}
        ]},
        // 9
        { type: "choice", pool: [
            {q: "Look at ________ ring on my finger (here).", c: "this", opts: ["this", "that", "these", "those"]},
            {q: "I like ________ book in my hand.", c: "this", opts: ["this", "that", "these", "those"]},
            {q: "Is ________ your pen here on the desk?", c: "this", opts: ["this", "that", "these", "those"]},
            {q: "Look at ________ star far away in the sky.", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "Who is ________ man over there across the street?", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "I want ________ toy on the top shelf.", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "________ shoes on my feet are new.", c: "these", opts: ["this", "that", "these", "those"]},
            {q: "Are ________ keys in my hand yours?", c: "these", opts: ["this", "that", "these", "those"]},
            {q: "________ flowers in this vase smell great.", c: "these", opts: ["this", "that", "these", "those"]},
            {q: "Look at ________ mountains in the distance.", c: "those", opts: ["this", "that", "these", "those"]},
            {q: "Who are ________ children playing over there?", c: "those", opts: ["this", "that", "these", "those"]},
            {q: "Can you see ________ clouds on the horizon?", c: "those", opts: ["this", "that", "these", "those"]},
            {q: "Is ________ dog over there friendly?", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "________ cat on my lap is sleeping.", c: "this", opts: ["this", "that", "these", "those"]},
            {q: "________ posters on that wall are cool.", c: "those", opts: ["this", "that", "these", "those"]},
            {q: "Are ________ your socks here on the floor?", c: "these", opts: ["this", "that", "these", "those"]},
            {q: "________ light in the sky is a planet.", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "________ kids here are very noisy.", c: "these", opts: ["this", "that", "these", "those"]},
            {q: "I want ________ sandwich on your plate.", c: "that", opts: ["this", "that", "these", "those"]},
            {q: "________ trees across the field are oaks.", c: "those", opts: ["this", "that", "these", "those"]}
        ]}
    ];

    // Combineer categorieën met titels
    oefeningen.forEach((cat, index) => cat.title = shortTitles[index]);

    let numTeams = 2;
    let scores = [];
    let boardData = []; // 6 kolommen
    let currentTile = null;

    function adjustTeams(change) {
        numTeams += change;
        if(numTeams < 1) numTeams = 1;
        if(numTeams > 4) numTeams = 4;
        document.getElementById('team-count-display').innerText = `${numTeams} Team${numTeams > 1 ? 's' : ''}`;
    }

    function startGame() {
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('game-area').style.display = 'flex';
        
        // Initialiseer scores
        scores = Array(numTeams).fill(0);
        renderScoreboard();

        // Kies willekeurig 6 van de 9 categorieën
        let shuffledCats = [...oefeningen].sort(() => 0.5 - Math.random()).slice(0, 6);
        
        // Bouw het speelbord
        boardData = shuffledCats.map(cat => {
            // Kies 5 willekeurige vragen uit de categorie
            let qs = [...cat.pool].sort(() => 0.5 - Math.random()).slice(0, 5);
            return {
                title: cat.title,
                type: cat.type,
                questions: qs
            };
        });

        renderBoard();
    }

    function renderScoreboard() {
        const sb = document.getElementById('scoreboard');
        sb.innerHTML = '';
        scores.forEach((score, index) => {
            sb.innerHTML += `
                <div class="team-score">
                    Team ${index + 1}
                    <span id="score-${index}">${score}</span>
                </div>
            `;
        });
    }

    function renderBoard() {
        const board = document.getElementById('board');
        board.innerHTML = '';
        
        // Headers (Kolom titels)
        boardData.forEach(col => {
            let header = document.createElement('div');
            header.className = 'category-header';
            header.innerText = col.title;
            board.appendChild(header);
        });

        // 5 rijen met vakjes (100 t/m 500)
        for(let row = 0; row < 5; row++) {
            boardData.forEach((col, colIndex) => {
                let points = (row + 1) * 100;
                let tile = document.createElement('div');
                tile.className = 'tile';
                tile.innerText = points;
                tile.onclick = () => openQuestion(tile, colIndex, row, points);
                board.appendChild(tile);
            });
        }
    }

    function openQuestion(tileElement, colIndex, rowIndex, points) {
        if(tileElement.classList.contains('played')) return;
        
        currentTile = { element: tileElement, points: points };
        const data = boardData[colIndex];
        const qData = data.questions[rowIndex];

        document.getElementById('m-cat').innerText = `${data.title.toUpperCase()} FOR ${points}`;
        document.getElementById('m-text').innerText = qData.q;
        
        if (data.type === "choice" && qData.opts) {
            document.getElementById('m-opts').innerText = `Options: ${qData.opts.join(' or ')}`;
            document.getElementById('m-opts').style.display = 'block';
        } else {
            document.getElementById('m-opts').style.display = 'none';
        }

        // Formatteer het antwoord (mooi weergeven als het een array is)
        let ansText = Array.isArray(qData.c) ? qData.c.join('  /  ') : qData.c;
        document.getElementById('m-ans').innerText = ansText;
        document.getElementById('m-ans').style.display = 'none';
        
        document.getElementById('btn-reveal').style.display = 'inline-block';
        
        // Bouw de punten-knoppen op voor het docent-paneel
        const awardDiv = document.getElementById('m-award');
        awardDiv.innerHTML = '';
        awardDiv.style.display = 'none';

        for(let i=0; i<numTeams; i++) {
            let btn = document.createElement('button');
            btn.className = 'btn-award';
            btn.innerText = `Team ${i+1} (+${points})`;
            btn.onclick = () => awardPoints(i, points);
            awardDiv.appendChild(btn);
        }
        let btnNobody = document.createElement('button');
        btnNobody.className = 'btn-nobody';
        btnNobody.innerText = "Nobody (Close)";
        btnNobody.onclick = () => awardPoints(-1, 0); // -1 = niemand
        awardDiv.appendChild(btnNobody);

        document.getElementById('modal').style.display = 'flex';
    }

    function revealAnswer() {
        document.getElementById('btn-reveal').style.display = 'none';
        document.getElementById('m-ans').style.display = 'block';
        document.getElementById('m-award').style.display = 'flex';
    }

    function awardPoints(teamIndex, points) {
        if(teamIndex >= 0) {
            scores[teamIndex] += points;
            document.getElementById(`score-${teamIndex}`).innerText = scores[teamIndex];
        }
        
        // Markeer het vakje op het bord als gespeeld
        currentTile.element.classList.add('played');
        currentTile.element.innerText = '';
        
        // Sluit modal
        document.getElementById('modal').style.display = 'none';
    }
</script>
</body>
</html>
